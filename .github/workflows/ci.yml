name: ci

on:
  push:
    branches: [main, v2]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            neco/requirements.txt
            neco/requirements-dev.txt
      - run: python -m pip install -r neco/requirements.txt -r neco/requirements-dev.txt
      - run: ruff check neco tests
      - run: pytest -q
