name: ci

on:
  push:
    branches: [main, v2]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            neco/requirements.txt
            neco/requirements-dev.txt
      - run: python -m pip install -r neco/requirements.txt -r neco/requirements-dev.txt
      - run: ruff check neco tests scripts/setup-persona.py
      - run: pytest -q
