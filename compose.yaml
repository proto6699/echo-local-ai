services:
  openwebui:
    build:
      context: ./openwebui
    container_name: echo-local-ai-webui
    restart: unless-stopped
    ports:
      - "${OPENWEBUI_PORT:-3000}:8080"
    volumes:
      - echo-local-ai-webui-data:/app/backend/data
    environment:
      WEBUI_SECRET_KEY: "${WEBUI_SECRET_KEY}"
      ENABLE_API_KEYS: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  echo-local-ai-webui-data:
