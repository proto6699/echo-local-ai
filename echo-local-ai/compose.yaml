services:
  openwebui:
    build:
      context: ./openwebui
      args:
        OPENWEBUI_VERSION: ${OPENWEBUI_VERSION:-v0.11.4}
    container_name: echo-local-ai-test
    restart: unless-stopped
    ports:
      - "${OPENWEBUI_PORT:-3001}:8080"
    volumes:
      - openwebui-data:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
volumes:
  openwebui-data:
